[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "van-ai-article-publishing-system"
version = "0.1.0"
description = "Source registry and validation for VAN's AI article publishing system"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7.0"]

[tool.setuptools.packages.find]
where = ["src"]
